<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TedSpectrum</title>
    <link rel="stylesheet" href="pico.min.css">
    <style>
        :root {
            --teds-zero: rgb(255, 255, 255);
            --teds-one: rgb(255, 0, 0);
            --teds-two: rgb(227, 66, 52);
            --teds-three: rgb(255, 165, 0);
            --teds-four: rgb(255, 255, 0);
            --teds-five: rgb(127, 255, 0);
            --teds-six: rgb(0, 128, 0);
            --teds-seven: rgb(0, 255, 255);
            --teds-eight: rgb(0, 0, 255);
            --teds-nine: rgb(138, 43, 226);
        }

        ::highlight(teds-0) {
            color: var(--teds-zero);
        }

        ::highlight(teds-1) {
            color: var(--teds-one);
        }

        ::highlight(teds-2) {
            color: var(--teds-two);
        }

        ::highlight(teds-3) {
            color: var(--teds-three);
        }

        ::highlight(teds-4) {
            color: var(--teds-four);
        }

        ::highlight(teds-5) {
            color: var(--teds-five);
        }

        ::highlight(teds-6) {
            color: var(--teds-six);
        }

        ::highlight(teds-7) {
            color: var(--teds-seven);
        }

        ::highlight(teds-8) {
            color: var(--teds-eight);
        }

        ::highlight(teds-9) {
            color: var(--teds-nine);
        }
    </style>

</head>

<body>
    <header class="container-fluid">
        <h1>Ted<span class="teds-spectrum">Spectrum</span>
        </h1>
    </header>
    <main class="container-fluid">
        <h2>A range of interesting things.</h2>
    </main>
    <footer class="container-fluid">
        <p>&copy; Ted<span class="teds-spectrum">Spectrum</span> 2026</p>
    </footer>
    <script>
        function createHighlights() {
            if (!CSS.highlights) return;
            // Create and register highlights
            const highlights = [];
            for (let i = 0; i < 10; i++) {
                // Create a new highlight for this color.
                const colorHighlight = new Highlight();
                highlights.push(colorHighlight);
                // Register this highlight under a custom name.
                CSS.highlights.set(`teds-${i}`, colorHighlight);
            }
            return highlights;
        }
        function addHighlightsToTextNode(textNode, highlights) {
            const text = textNode.textContent;
            for (let i = 0; i < text.length; i++) {
                // Create a new range just for this character.
                const range = new Range();
                const highlight = (i + 1) % highlights.length;
                range.setStart(textNode, i);
                range.setEnd(textNode, i + 1);
                // Add the range to the next available highlight,
                // looping back to the first one once we've reached the 7th.
                if (highlight in highlights)
                    highlights[highlight].add(range);
            }
        }
        function addHighlights(element, highlights) {
            if (!element.hasChildNodes()) return;
            for (const child of element.childNodes) {
                if (child.nodeType === Node.TEXT_NODE)
                    addHighlightsToTextNode(child, highlights);
            }
        }
        const highlights = createHighlights();
        const elementsToHighlight = document.getElementsByClassName('teds-spectrum');
        for (const element of elementsToHighlight) {
            addHighlights(element, highlights);
        }
    </script>
</body>

</html>
