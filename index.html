<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TedSpectrum</title>
    <link rel="stylesheet" href="pico.min.css">
    <style>
        :root {
            --teds-zero: rgb(255, 255, 255);
            --teds-one: rgb(255, 0, 0);
            --teds-two: rgb(227, 66, 52);
            --teds-three: rgb(255, 165, 0);
            --teds-four: rgb(255, 255, 0);
            --teds-five: rgb(127, 255, 0);
            --teds-six: rgb(0, 128, 0);
            --teds-seven: rgb(0, 255, 255);
            --teds-eight: rgb(0, 0, 255);
            --teds-nine: rgb(138, 43, 226);
        }

        .teds-spectrum {
            :nth-child(1) {
                color: var(--teds-one);
            }

            :nth-child(2) {
                color: var(--teds-two);
            }

            :nth-child(3) {
                color: var(--teds-three);
            }

            :nth-child(4) {
                color: var(--teds-four);
            }

            :nth-child(5) {
                color: var(--teds-five);
            }

            :nth-child(6) {
                color: var(--teds-six);
            }

            :nth-child(7) {
                color: var(--teds-seven);
            }

            :nth-child(8) {
                color: var(--teds-eight);
            }

            :nth-child(9) {
                color: var(--teds-nine);
            }
        }
    </style>

</head>

<body>
    <header class="container-fluid">
        <h1>Ted<span class="teds-spectrum"><!--
            --><span>S</span><!--
            --><span>p</span><!--
            --><span>e</span><!--
            --><span>c</span><!--
            --><span>t</span><!--
            --><span>r</span><!--
            --><span>u</span><!--
            --><span>m</span><!--
            --><span>.</span></span>
        </h1>
    </header>
    <main class="container-fluid">
        <h2>A range of interesting things.</h2>
    </main>
    <footer class="container-fluid">
        <p>&copy; Ted<span class="teds-spectrum"><!--
            --><span>S</span><!--
            --><span>p</span><!--
            --><span>e</span><!--
            --><span>c</span><!--
            --><span>t</span><!--
            --><span>r</span><!--
            --><span>u</span><!--
            --><span>m</span><!--
            --></span> 2026</p>
    </footer>
</body>

</html>
